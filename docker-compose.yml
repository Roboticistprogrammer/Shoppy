services:
  postgres:
    image: postgres:16-alpine
    container_name: teamcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamcart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamcart_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-teamcart}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Optional: a GUI for poking at the database. Comment out if you'd rather
  # use `npx prisma studio` from apps/backend instead.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: teamcart-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@teamcart.local
      PGADMIN_DEFAULT_PASSWORD: dev
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
